[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qeco"
version = "0.0.0"
readme = "README.md"
description = "Quantum-enhanced constrained optimization"
license = {file = "LICENSE.txt"}
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]

requires-python = ">=3.9"

dependencies = [
    "numpy>=1.23",
    "numba",
    "pylatexenc",
    "matplotlib",
    "qiskit>=1.3, <2",
    "qiskit_aer>=0.17.0",
    "qiskit_optimization",
    "docplex",
    "qiskit-optimization[cplex]",
    "cplex>=12.10",
    "networkx",
    "pyyaml",
    "qopt-best-practices @ git+https://github.com/qiskit-community/qopt-best-practices.git@e5743e7bb220db145d5f2da1d6840495b8e90b21",
]

[project.optional-dependencies]
dev = [
    "qeco[notebook-dependencies,test,lint]",
    "tox>=4.4.3",
    "pyyaml",
]
basetest = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
test = [
    "qeco[basetest]",
    "matplotlib",
    "docplex",
    "qiskit-optimization",
    "qiskit-optimization[cplex]",
    "cplex>=12.10",
    "pyyaml",
]
style = [
    "ruff==0.8.1",
]
lint = [
    "qeco[style]",
    "mypy==1.13.0",
    "types-PyYAML==6.0.12.20240917",
]
notebook-dependencies = [
    "qeco",
    "matplotlib",
    "pylatexenc",
    "qiskit-optimization[cplex]",
    "cplex>=12.10",
    "qiskit-optimization",
]

[tool.coverage.run]
branch = true
parallel = true

[tool.coverage.report]
show_missing = true

[tool.hatch.build.targets.wheel]
packages = [
    "src/qeco",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.mypy]
python_version = 3.9
show_error_codes = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
src = ["src/qeco", "test"]
target-version = "py39"

[tool.ruff.lint]
select = [
    "I",   # isort
    "E",   # pycodestyle
    "W",   # pycodestyle
    "D",   # pydocstyle
    "F",   # pyflakes
    "RUF", # ruff
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
]
ignore = [
    "E501", # line too long
]

[tool.ruff.lint.pylint]
max-args = 6

[tool.ruff.lint.extend-per-file-ignores]
"test/**.py" = [
    "D",  # pydocstyle
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.typos.default.extend-words]
